<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noticias de la mañana</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#5d6675;--acc:#c8102e;--bd:#dde1e7;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--tx:#eef1f6;--mut:#9aa4b5;--acc:#ff5a6e;--bd:#2a303b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 Georgia,"Times New Roman",serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 1.5rem/1.2 system-ui,sans-serif;margin:8px 0 2px}
#upd{color:var(--mut);font:.85rem system-ui,sans-serif;margin:0 0 14px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{flex:1;font:600 1rem system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
nav button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 16px 10px;margin-bottom:14px}
h2{font:700 1.1rem system-ui,sans-serif;color:var(--acc);margin:12px 0 4px}
ol{margin:0;padding-left:1.3em}
li{padding:9px 0;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
a{color:var(--tx);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{text-decoration:underline}
li p{margin:3px 0 0;color:var(--mut);font-size:.9rem}
.err{color:var(--mut);font:.9rem system-ui,sans-serif;padding:6px 0}
</style>
</head>
<body>
<main>
<h1>Noticias de la mañana</h1>
<p id="upd">Cargando…</p>
<nav id="tabs"></nav>
<div id="out"></div>
</main>
<script>
var data,cur="es";
function render(){
var out=document.getElementById("out");out.textContent="";
var sec=data.sections.filter(function(s){return s.id===cur})[0];
sec.outlets.forEach(function(o){
var s=document.createElement("section"),h=document.createElement("h2");
h.textContent=o.name;s.appendChild(h);
if(!o.items.length){var e=document.createElement("div");e.className="err";e.textContent=o.error||"Sin noticias";s.appendChild(e)}
else{var ol=document.createElement("ol");
o.items.forEach(function(i){var li=document.createElement("li"),a=document.createElement("a");
a.textContent=i.title;a.href=i.link;a.target="_blank";a.rel="noopener";li.appendChild(a);
if(i.desc){var p=document.createElement("p");p.textContent=i.desc;li.appendChild(p)}
ol.appendChild(li)});s.appendChild(ol)}
out.appendChild(s)});
var t=document.getElementById("tabs");t.textContent="";
data.sections.forEach(function(s){var b=document.createElement("button");b.textContent=s.name;
b.setAttribute("aria-pressed",s.id===cur);b.onclick=function(){cur=s.id;render()};t.appendChild(b)})}
fetch("news.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
data=d;var dt=new Date(d.updated);
document.getElementById("upd").textContent="Actualizado: "+dt.toLocaleString("es",{dateStyle:"full",timeStyle:"short"});
render()}).catch(function(){document.getElementById("upd").textContent="Todavía no hay noticias. Ejecuta la actualización en GitHub (paso 4)."});
</script>
</body>
</html>
